name: Auto-Label Priority

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  set-priority:
    runs-on: ubuntu-latest
    steps:
      - name: Set priority label from issue form
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;

            // Body der Issue-Form durchsuchen.
            // Typisches Muster bei Issue Forms:
            // "### Priorität\n\nP1 – Hoch"
            const body = issue.body || "";
            const match = body.match(/#+\s*Priorit[aä]t\s*\n+([^\n]+)/i);
            let selected = match ? match[1].trim() : null;

            // Mappings und erlaubte Labels
            const allowed = [
              "P0 – Kritisch",
              "P1 – Hoch",
              "P2 – Mittel",
              "P3 – Niedrig"
            ];

            // Falls jemand nur "P1" schreibt, normalisieren
            if (selected && /^P[0-3]\b/.test(selected)) {
              const map = {P0: allowed[0], P1: allowed[1], P2: allowed[2], P3: allowed[3]};
              selected = map[selected.substring(0,2)] || selected;
            }

            if (!selected || !allowed.includes(selected)) {
              core.info("Keine gültige Priorität gefunden – Workflow beendet.");
              return;
            }

            // Existierende P*-Labels entfernen, dann ausgewähltes setzen
            const existing = issue.labels.map(l => typeof l === 'string' ? l : l.name);
            const toRemove = existing.filter(n => /^P[0-3]\s/.test(n));
            for (const name of toRemove) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name
              }).catch(()=>{});
            }

            if (!existing.includes(selected)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: [selected]
              });
            }

            core.info(`Priorität gesetzt: ${selected}`);
